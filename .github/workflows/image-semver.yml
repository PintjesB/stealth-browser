name: Tag verified runtime image with SemVer

# Workflow-run privileges are only used for a successful push build on the default branch.
# Git tags use image-vX.Y.Z to avoid conflicting with application vX.Y.Z releases.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: verified-image-semver-main
  cancel-in-progress: false
  queue: max

jobs:
  tag-verified-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful image publication from the checked commit
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISH_JOB: "Publish image"
          DEFAULT_BRANCH: "main"
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --paginate --jq '.jobs[] | select(.name == env.PUBLISH_JOB) | .conclusion' | head -n 1)"
          if [[ -z "$status" ]]; then
            echo "::error::Required image publish job not found: $PUBLISH_JOB"
            exit 1
          fi
          if [[ "$status" == skipped ]]; then
            echo "No runtime image was published by this successful build"
            exit 0
          fi
          if [[ "$status" != success ]]; then
            echo "::error::Image publish job did not succeed: $status"
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Checkout the published and verified revision
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.gate.outputs.eligible == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GHCR
        if: steps.gate.outputs.eligible == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified SHA digest and create immutable image release tag
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: "ghcr.io/pintjesb/stealth-browser"
          DEFAULT_BRANCH: "main"
          VERSION_FLOOR: "1.0.0"
        run: |
          set -euo pipefail

          # Return an empty digest only for a registry response that confirms absence.
          inspect_digest() {
            local reference="$1" result digest
            if result="$(docker buildx imagetools inspect "$reference" 2>&1)"; then
              digest="$(awk '$1 == "Digest:" && !found++ { print $2 }' <<< "$result")"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$digest"
                return
              fi
              echo "::error::Invalid image digest for $reference" >&2
            elif [[ "$result" == "ERROR: $reference: not found" ]]; then
              return 0
            else
              printf '%s\n' "$result" >&2
            fi
            return 1
          }

          publish_version() {
            local version="$1" revision="$2" digest="$3" existing actual source_digest
            existing="$(inspect_digest "$IMAGE:$version")"
            if [[ "$existing" == "$digest" ]]; then
              echo "Already published $IMAGE:$version@$digest at $revision"
              return
            fi
            if [[ -n "$existing" ]]; then
              echo "::error::Immutable SemVer tag collision for $IMAGE:$version"
              return 1
            fi

            # A Git reservation alone does not authorize an image promotion.
            source_digest="$(inspect_digest "$IMAGE:sha-${revision:0:12}")"
            if [[ "$source_digest" != "$digest" ]]; then
              echo "::error::Source SHA tag no longer matches reserved digest for $IMAGE:$version at $revision"
              return 1
            fi

            git fetch --force origin "$DEFAULT_BRANCH"
            if ! git merge-base --is-ancestor "$revision" FETCH_HEAD; then
              echo "::error::Reserved image $version at $revision is no longer on $DEFAULT_BRANCH"
              return 1
            fi
            docker buildx imagetools create --prefer-index=false \
              --tag "$IMAGE:$version" "$IMAGE@$digest"
            actual="$(inspect_digest "$IMAGE:$version")"
            if [[ "$actual" != "$digest" ]]; then
              echo "::error::Image digest mismatch for $IMAGE:$version"
              return 1
            fi
            echo "Published $IMAGE:$version@$digest at $revision" >> "$GITHUB_STEP_SUMMARY"
          }

          # Fetch authentication is necessary for private repositories after checkout
          # with persist-credentials=false.
          gh auth setup-git
          git fetch --force --prune origin "$DEFAULT_BRANCH" 'refs/tags/image-v*:refs/tags/image-v*'
          if ! git merge-base --is-ancestor "$HEAD_SHA" FETCH_HEAD; then
            echo "Skip obsolete build after a force-push: $HEAD_SHA"
            exit 0
          fi

          # Release jobs are serialized. Complete the latest reservation from its
          # recorded digest before considering a later or out-of-order build.
          tags="$(git tag --list 'image-v[0-9]*')"
          latest="$(awk '/^image-v[0-9]+\.[0-9]+\.[0-9]+$/' <<< "$tags" | sort -V | tail -n 1)"
          marker="Verified runtime image digest: "
          if [[ -n "$latest" ]]; then
            latest_ref="refs/tags/$latest"
            last_sha="$(git rev-parse "$latest_ref^{commit}")"
            if [[ "$(git cat-file -t "$latest_ref")" == tag ]]; then
              subject="$(git for-each-ref --format='%(contents:subject)' "$latest_ref")"
              if [[ "$subject" == "$marker"* ]]; then
                reserved_digest="${subject#"$marker"}"
                if [[ ! "$reserved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::Invalid reserved digest on $latest"
                  exit 1
                fi
                publish_version "${latest#image-v}" "$last_sha" "$reserved_digest"
              fi
            fi
            if [[ "$last_sha" == "$HEAD_SHA" ]]; then
              echo "Already released this commit: $latest"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$last_sha" "$HEAD_SHA"; then
              echo "::notice::Build $HEAD_SHA superseded by release $latest at $last_sha"
              exit 0
            fi
            previous="${latest#image-v}"
            commits="$(git log "$last_sha..$HEAD_SHA" --format='%s%n%b')"
          else
            previous="$VERSION_FLOOR"
            commits=""
          fi

          IFS=. read -r major minor patch <<< "$previous"
          if grep -Eiq '(^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:)' <<< "$commits"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -Eiq '^feat(\([^)]*\))?:' <<< "$commits"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          source="$IMAGE:sha-${HEAD_SHA:0:12}"
          source_digest="$(inspect_digest "$source")"
          if [[ -z "$source_digest" ]]; then
            echo "::error::Cannot resolve verified image digest for $source"
            exit 1
          fi

          # A legacy registry-first release may have left a version without a Git
          # tag. Keep that version intact. Advance only past a known predecessor.
          while :; do
            version="$major.$minor.$patch"
            existing="$(inspect_digest "$IMAGE:$version")"
            if [[ -z "$existing" || "$existing" == "$source_digest" ]]; then
              break
            fi
            orphan_sha="$(docker buildx imagetools inspect "$IMAGE@$existing" --format '{{json .Image}}' |
              jq -r '[.. | objects | .config.Labels? | objects | .["org.opencontainers.image.revision"] | strings]
                | unique | if length == 1 then .[0] else empty end')"
            if [[ ! "$orphan_sha" =~ ^[0-9a-f]{40}$ ]] ||
              [[ "$(git cat-file -t "$orphan_sha" 2>/dev/null)" != commit ]]; then
              echo "::error::Cannot establish the source revision of occupied $IMAGE:$version@$existing"
              exit 1
            fi
          if [[ "$orphan_sha" == "$HEAD_SHA" ]]; then
            echo "::error::Occupied $IMAGE:$version already points to a different digest for $HEAD_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$orphan_sha" FETCH_HEAD; then
            echo "::error::Occupied $IMAGE:$version has detached revision $orphan_sha"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$orphan_sha" "$HEAD_SHA"; then
              if git merge-base --is-ancestor "$HEAD_SHA" "$orphan_sha"; then
                echo "::notice::Build $HEAD_SHA superseded by $IMAGE:$version at $orphan_sha"
                exit 0
              fi
              echo "::error::Occupied $IMAGE:$version has unrelated revision $orphan_sha"
              exit 1
            fi
            echo "::notice::Keeping occupied $IMAGE:$version at $orphan_sha"
            patch=$((patch + 1))
          done

          # Allow valid ancestor builds when the branch advances normally.
          git fetch --force origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$HEAD_SHA" FETCH_HEAD; then
            echo "::notice::Skipping superseded non-ancestor build: $HEAD_SHA"
            exit 0
          fi

          # Reserve the version and verified digest in Git before writing to GHCR.
          # If publication is interrupted, a retry or later eligible run can finish it.
          tag="image-v$version"
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" -f message="$marker$source_digest" -f object="$HEAD_SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --jq '.sha')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$tag_object" >/dev/null
          publish_version "$version" "$HEAD_SHA" "$source_digest"
