name: ci

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: stealth-browser-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify (audit / syntax)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check server syntax
        run: node --check stealth-server.js

  secret-scan:
    name: Secret scan (tree + history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.12"

      - name: Scan tracked files and reachable history for secrets
        run: python3 .github/scripts/scan_secrets.py --tree --history

  build-validate:
    name: Build / scan / smoke
    runs-on: ubuntu-latest
    needs:
      - verify
      - secret-scan
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v6
        with:
          context: .
          load: true
          tags: stealth-browser:ci
          provenance: false
          sbom: false

      - name: Scan built image on release refs
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.28
        with:
          image-ref: stealth-browser:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan built image on branch and PR refs
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.28
        with:
          image-ref: stealth-browser:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Smoke test runtime
        shell: bash
        run: |
          cid="$(docker run -d -p 17332:7332 \
            --tmpfs /tmp:size=256m,mode=1777 \
            --tmpfs /contexts:size=256m,mode=1777 \
            -e HOME=/tmp \
            -e XDG_CONFIG_HOME=/tmp/.config \
            -e XDG_CACHE_HOME=/tmp/.cache \
            -e CONTEXTS_DIR=/contexts \
            -e BROWSER_WARMUP_ON_START=1 \
            stealth-browser:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:17332/health > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"warmup_succeeded":true' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1

  publish:
    name: Publish image
    if: >
      github.event_name == 'push' &&
      github.repository == 'PintjesB/stealth-browser' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs:
      - verify
      - secret-scan
      - build-validate
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and OCI labels
        id: meta
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/stealth-browser"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha_tag="sha-${GITHUB_SHA::12}"
          {
            echo "image=${image}"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=stealth-browser"
            echo "org.opencontainers.image.description=Reusable Patchright stealth browser runtime image"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
            echo "tags<<EOF"
            echo "${image}:${sha_tag}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:main"
              echo "${image}:latest"
            fi
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME}"
              echo "${image}:${version}"
              if [[ "${version}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                echo "${image}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              fi
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3

      - name: Sign published image digest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
